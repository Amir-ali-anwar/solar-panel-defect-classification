services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    environment:
      - MODEL_PATH=/models/solar_panel_classifier.keras
      - CLASS_NAMES_PATH=/models/class_names.json
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:8080"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
